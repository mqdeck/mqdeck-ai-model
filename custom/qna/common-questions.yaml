    language: en
    license_class: public
    license_id: MIT
    copyright: Copyright (c) 2026 MQDeck contributors
    license_url: LICENSE
    question: How do I check the current depth of a queue?
    answer: Use `DISPLAY QLOCAL(MY.QUEUE) CURDEPTH`. Replace `MY.QUEUE` with the real object name.
