build:
  profile: public
  remote_collection_enabled: false
  allowed_license_classes:
    public: [public]
  allowed_license_ids:
    public: [MIT]

source_policy:
  require_explicit_license: true
  require_copyright_notice: true
  reject_unknown_license: true
  reject_remote_urls: true
  reject_third_party_content_by_default: true
