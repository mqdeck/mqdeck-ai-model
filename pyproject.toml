[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "mqdeck-ai-model"
version = "0.1.0"
description = "A traceable enterprise-messaging model preparation, fine-tuning, evaluation, and GGUF export pipeline."
readme = "README.md"
requires-python = ">=3.10"
license = {text = "MIT"}
dependencies = [
  "PyYAML>=6,<7",
]

[project.optional-dependencies]
train = [
  "accelerate>=1.8,<2",
  "bitsandbytes>=0.46,<0.47; platform_system == 'Linux'",
  "datasets>=3.6,<4",
  "peft>=0.16,<0.17",
  "torch>=2.7,<3",
  "transformers>=4.53,<4.54",
  "trl>=0.19,<0.20",
]
dev = ["black>=24.4", "mypy>=1.10", "pytest>=8", "ruff>=0.4", "types-PyYAML", "types-requests"]

[tool.hatch.build.targets.wheel]
packages = ["pipeline", "training", "export"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.black]
line-length = 100
target-version = ["py310"]

[tool.mypy]
python_version = "3.10"
ignore_missing_imports = true
